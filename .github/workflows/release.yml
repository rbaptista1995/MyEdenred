name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: Build and attach myedenred.zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build myedenred.zip
        run: python .github/scripts/build_release_zip.py

      - name: Attach asset to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/myedenred.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
